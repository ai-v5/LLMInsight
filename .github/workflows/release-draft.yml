name: Build verified release draft

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA on the default branch
        required: true
        type: string
      release_id:
        description: Existing draft Release ID to receive the Windows installer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_ID: ${{ inputs.release_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_ID -notmatch '^\d+$') {
            throw 'Full commit SHA and numeric draft ID are required'
          }
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          git merge-base --is-ancestor $env:SOURCE_SHA "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Source must belong to the default branch history' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Install Windows build dependencies
        run: |
          python -m pip install -r scripts/requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies installation failed' }
      - name: Prepare signed Inno Setup compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'inno-source'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-portable'
          New-Item -ItemType Directory -Path $source | Out-Null
          gh release download is-7_1_1 --repo jrsoftware/issrc --pattern innosetup-7.1.1-x64.exe --dir $source
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed' }
          $setup = Join-Path $source 'innosetup-7.1.1-x64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Inno Setup publisher signature verification failed'
          }
          $proc = Start-Process -FilePath $setup -ArgumentList @('/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$compiler") -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath "$compiler/ISCC.exe")) { throw 'Portable compiler setup failed' }
      - name: Build and smoke-test the installer
        run: |
          ./scripts/build_windows.ps1 -InnoCompiler "$env:RUNNER_TEMP/inno-portable/ISCC.exe"
          python scripts/smoke_windows_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
          $installer = Get-Item -LiteralPath 'dist/LLMInsight-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/SHA256SUMS'), "$hash  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
      - name: Upload to the matching draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read target draft' }
          $release = $releaseJson | ConvertFrom-Json
          $installer = Get-Item -LiteralPath 'dist/LLMInsight-Setup-x64.exe'
          $version = python -c "from llminsight import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version' }
          if (!$release.draft -or $release.tag_name -ne "v$version" -or $release.target_commitish -ne $env:SOURCE_SHA) {
            throw 'Draft tag/source mismatch or Release already published'
          }
          gh release upload $release.tag_name $installer.FullName 'dist/SHA256SUMS' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
          $assetsJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify uploaded assets' }
          $assets = $assetsJson | ConvertFrom-Json
          foreach ($path in @($installer.FullName, (Join-Path (Get-Location) 'dist/SHA256SUMS'))) {
            $name = [IO.Path]::GetFileName($path)
            $asset = @($assets | Where-Object name -EQ $name)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -ne "sha256:$hash") {
              throw "Uploaded digest mismatch: $name"
            }
            Write-Output "$name SHA256 $hash"
          }
          Write-Output 'Draft upload verified. Publish and old-Release cleanup require the release operator verification in AGENTS.md.'
