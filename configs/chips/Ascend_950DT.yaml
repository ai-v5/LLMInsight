# Public reference preset: 32-Cube Ascend 950DT, with the 96 GB memory option.
# This selects a reference configuration; it does not identify the captured SKU.
# Huawei Ascend 950 NPU architecture whitepaper, table 3-1, PDF pages 13-15:
# https://public-download.obs.cn-east-2.myhuaweicloud.com/ascend/%E6%98%87%E8%85%BE950%20NPU%E6%9E%B6%E6%9E%84%E7%99%BD%E7%9A%AE%E4%B9%A6.pdf
# Independent public confirmation of the 32-Cube compute reference:
# https://github.com/deepseek-ai/DeepGEMM-Ascend/issues/1
# The 96 GB / 4 TB/s option is also published for Atlas 650E:
# https://www.hiascend.com/hardware/ai-server
# Cube and Vector peaks are separate; memory options do not identify core count.
name: Ascend 950DT
fp4_tflops: 1730.0         # Cube MXFP4, public 32-Cube reference
fp8_tflops: 865.0          # Cube FP8/MXFP8/HiF8, same reference
fp16_tflops: 432.0         # Cube BF16/FP16
fp32_tflops: 27.0          # Vector FP32
bf16_vector_tflops: 54.0   # Vector BF16/FP16
memory_bandwidth: 4000000000000.0
memory_capacity: 96000000000.0
# PCIe 5.0 x16 is 128 GB/s bidirectional in table 3-1; 64 GB/s per direction.
pcie_bandwidth: 64000000000.0
# These are analysis heuristics, not hardware specifications or measurements.
mfu_ceilings:
  matmul: 0.95
  attention: 0.85
  attention_grad: 0.70
